
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMarket - ตลาดนัดออนไลน์</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>🛍️ UniMarket</h2>
    <nav>
      <a href="#home">หน้าแรก</a>
      <a href="#market">ตลาดสินค้า</a>
      <a href="#about">เกี่ยวกับเรา</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>ตลาดนัดออนไลน์ UniMarket</h1>
    <p>ซื้อขายสินค้าได้ง่าย ๆ ในที่เดียว</p>
    <a href="#market" class="button">เลือกดูสินค้า</a>
  </section>

  <section id="market">
    <h2>สินค้าทั้งหมด</h2>
    <input id="search" type="text"
      placeholder="ค้นหาสินค้า..."
      oninput="searchProduct()">

    <div class="products" id="products"></div>
  </section>

  <section id="about">
    <h2>เกี่ยวกับ UniMarket</h2>
    <p>พื้นที่สำหรับซื้อขายสินค้าออนไลน์
      เปิดโอกาสให้ทุกคนสามารถลงขายและเลือกซื้อสินค้าได้</p>
  </section>

  <footer>
    <p>© 2026 UniMarket</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
